name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

    - name: Run Unit Tests
      env:
        LLMEDGE_SKIP_E2E_IN_UNIT: "true"
      run: ./gradlew :llmedge:testDebugUnitTest

    - name: Grant execute permission for scripts
      run: |
        chmod +x gradlew
        chmod +x scripts/*.sh
        chmod +x .github/scripts/*.sh

    - name: Install Native Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential ninja-build glslc libvulkan-dev

    - name: Build Native Libraries
      run: |
        source scripts/native_targets.sh
        ./scripts/build_native_linux.sh "${LLMEDGE_CI_TARGETS[@]}"

    - name: Build Android AAR (Vulkan enabled)
      run: |
        ./gradlew :llmedge:assembleRelease -Pandroid.jniCmakeArgs="-DGGML_VULKAN=ON -DSD_VULKAN=ON"

    - name: Validate Example App
      env:
        LLMEDGE_SKIP_LIBRARY_BUILD: "true"
        LLMEDGE_EXAMPLES_GRADLE_TASKS: ":app:assembleDebug :app:assembleRelease"
      run: |
        bash scripts/validate_examples.sh

    - name: Download Test Models
      run: .github/scripts/download_models.sh

    - name: Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run Vision Smoke Test (Emulator)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: aosp_atd
        arch: x86_64
        profile: pixel_6
        emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
        disable-animations: true
        script: >
          ./gradlew :llmedge:connectedDebugAndroidTest
          -Pandroid.testInstrumentationRunnerArguments.class=io.aatricks.llmedge.VisionSmokeTest

    - name: Run E2E Tests (Whisper)
      run: |
        source scripts/native_targets.sh
        export LLMEDGE_TEST_WHISPER_MODEL_PATH="${{ github.workspace }}/models/ggml-tiny.en.bin"
        export LLMEDGE_BUILD_WHISPER_LIB_PATH="${{ github.workspace }}/llmedge/build/native/linux-x86_64/$(llmedge_native_output_name whisper)"
        ./gradlew :llmedge:testDebugUnitTest --tests "*WhisperLinuxE2ETest"

    - name: Run E2E Tests (SmolLM Text)
      env:
        LLMEDGE_TEST_TEXT_MODEL_PATH: ${{ github.workspace }}/models/SmolLM2-135M-Instruct-Q8_0.gguf
      run: |
        ./scripts/run_text_e2e.sh

    - name: Run E2E Tests (Image, classic checkpoint)
      run: |
        source scripts/native_targets.sh
        export LLMEDGE_TEST_SD_MODEL_PATH="${{ github.workspace }}/models/sd_turbo-f16-q8_0.gguf"
        export LLMEDGE_BUILD_NATIVE_LIB_PATH="${{ github.workspace }}/llmedge/build/native/linux-x86_64/$(llmedge_native_output_name sdcpp)"
        ./gradlew :llmedge:testDebugUnitTest --tests "*ImageGenerationClassicLinuxE2ETest"
