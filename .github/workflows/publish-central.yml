name: Publish Central

on:
  push:
    tags:
      - "V*"
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version to publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  maven-central:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set publish version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RAW_VERSION="${GITHUB_REF_NAME}"
          else
            RAW_VERSION="${{ inputs.version }}"
          fi

          PUBLISH_VERSION="${RAW_VERSION#v}"
          PUBLISH_VERSION="${PUBLISH_VERSION#V}"
          echo "PUBLISH_VERSION=${PUBLISH_VERSION}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh

      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build glslc libvulkan-dev

      - name: Normalize signing key
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_KEY_B64: ${{ secrets.MAVEN_SIGNING_KEY_B64 }}
        run: |
          if [[ -n "${MAVEN_SIGNING_KEY_B64}" ]]; then
            SIGNING_KEY="$(printf '%s' "${MAVEN_SIGNING_KEY_B64}" | tr -d '[:space:]' | base64 --decode)"
          else
            SIGNING_KEY="$(printf '%b' "${MAVEN_SIGNING_KEY}")"
          fi

          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "Missing MAVEN_SIGNING_KEY or MAVEN_SIGNING_KEY_B64" >&2
            exit 1
          fi

          if ! printf '%s' "${SIGNING_KEY}" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "Decoded signing key is not an ASCII-armored PGP private key block" >&2
            exit 1
          fi

          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF"
            printf '%s\n' "${SIGNING_KEY}" | tr -d '\r'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Validate signing key with GPG
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.ORG_GRADLE_PROJECT_signingInMemoryKey }}
        run: |
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          KEY_FILE="$(mktemp)"
          printf '%s\n' "${ORG_GRADLE_PROJECT_signingInMemoryKey}" > "${KEY_FILE}"
          gpg --batch --import-options show-only --dry-run --import "${KEY_FILE}" >/dev/null

      - name: Publish release AAR to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon publishAndReleaseToMavenCentral \
            -PVERSION_NAME="${PUBLISH_VERSION}"
