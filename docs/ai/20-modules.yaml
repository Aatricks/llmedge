schema: ai-context/v1
modules:
  - name: "facade-and-lifecycle"
    owner_module: "LLMEdge facade"
    purpose: "Top-level API surface, config defaults, shared client bootstrap, feature dependency context wiring, lifecycle binding, deprecated aliases."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/LLMEdge.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/LLMEdgeConfig.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/ClientBootstrap.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/FeatureClientSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/lifecycle/LLMEdgeLifecycle.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/Deprecated.kt"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge"
      - "llmedge/src/main/java/io/aatricks/llmedge/lifecycle"
    must_not_move_without:
      - "feature clients under text/speech/image/vision/rag"
      - "example app composite-build validation in llmedge-examples and scripts/validate_examples.sh"
    boundaries:
      - "Keeps library manifest/UI-free; only wires clients and lifecycle."
      - "LLMEdgeConfig.execution sizes the shared LLMEdgeScope; text and vision runtime defaults are configured independently under config.text and config.vision."
      - "ClientBootstrap.createOwned/close are the shared seams for feature-client owned-scope setup and teardown."
      - "FeatureContext/createOwnedFeature/OwnedFeatureClient keep feature clients on one shared dependency shape; FeatureClientFactory-backed create/forTesting helpers are the preferred companion pattern."
      - "LLMEdge is the canonical public entrypoint; direct feature-client create(...) helpers are advanced construction paths, not the primary docs path."
      - "Public signature changes require example app validation."
  - name: "core-runtime"
    owner_module: "runtime orchestration"
    purpose: "Coroutine scope, native load helpers, runtime pools, runtime execution retry, backend fallback, resource ownership."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/core"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime"
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime/ModelCache.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime/ComputeBackend.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime/RuntimeEnvironment.kt"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/core"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime"
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime"
    must_not_move_without:
      - "all feature runtime support files"
      - "NativeLibraryLoader candidate names in wrappers/CMake"
    safe_refactor_zone:
      - "Shared helpers and cache policy can move internally if cache-key semantics and backend blacklist behavior are preserved."
      - "RuntimeLoader implementations should resolve files and construct runtimes only; backend candidate iteration belongs in RuntimeCoordinator."
      - "RuntimePool is the shared acquire/retry/exclusive-execution surface for feature-level request executors; keep pool plumbing there instead of re-spreading it across features."
      - "RuntimeCapabilities is the shared home for Stable Diffusion/OpenCL/Vulkan probes; feature stacks should not depend on LLMEdge facade statics for capability checks."
  - name: "model-resolution-and-hf"
    owner_module: "model acquisition"
    purpose: "ModelSpec contracts, default model catalog, model repository, Hugging Face file selection/download orchestration, Wan asset catalog."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/model"
      - "llmedge/src/main/java/io/aatricks/llmedge/model/DefaultModelCatalog.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface"
      - "llmedge/src/main/assets/wan-models/model-registry.json"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/model"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface"
      - "llmedge/src/main/assets/wan-models"
    must_not_move_without:
      - "feature default ModelRegistry values"
      - "storage-root documentation and tests"
    boundaries:
      - "All persistent model downloads land under context.filesDir/hf-models."
      - "DefaultModelCatalog is the declarative source for built-in model presets consumed by ModelRegistry."
      - "HuggingFaceHub is an advanced facade; selection, download, and Wan side-asset resolution live in focused helpers."
      - "HuggingFaceHub routes GGUF and repo-file downloads through one ArtifactRequest pipeline; non-.gguf filenames remain repo-file resolutions."
      - "HFArtifactRequestSupport owns internal artifact-request and download-context wiring so HuggingFaceHub stays focused on the public entrypoints."
  - name: "text-stack"
    owner_module: "text inference"
    purpose: "SmolLM runtime, text generation, streaming, chat replay, tool-agent substrate."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/text"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/runtime"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/runtime/SmolLMCompanionSupport.kt"
      - "llmedge/src/main/cpp/smollm*.cpp"
      - "llmedge/src/main/cpp/LLMInference.*"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/text"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/runtime"
      - "llmedge/src/main/cpp/smollm.cpp"
      - "llmedge/src/main/cpp/smollm_jni_*.cpp"
      - "llmedge/src/main/cpp/LLMInference.cpp"
      - "llmedge/src/main/cpp/LLMInference.h"
    must_not_move_without:
      - "NativeLibraryLoader.smolLmCandidates()"
      - "llmedge-smollm.cmake"
      - "vision interop files using SmolLM"
    boundaries:
      - "Non-session calls clear messages and KV cache per request."
      - "ChatSession owns Kotlin transcript + optional native state snapshot reuse."
      - "TextRequestExecutor owns request-level retry/stream orchestration on top of RuntimePool; TextRuntimeSession owns in-runtime execution."
      - "SmolLMCompanionSupport plus SmolLMLoader own native-load policy, bridge overrides, backend fallback, and batch-size defaults so SmolLM stays focused on runtime behavior."
      - "JNI-facing Kotlin externals must keep stable JVM names; avoid relying on Kotlin internal-name mangling for native entrypoints."
  - name: "tools-stack"
    owner_module: "tool calling"
    purpose: "Tool schemas, parser, policy, trace/result/event contracts, Android device tools."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/tools"
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/tools"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/tools"
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/tools"
    must_not_move_without:
      - "TextClient and ConversationWindow"
    boundaries:
      - "Tool envelopes are JSON-only; action tools require policy approval unless ALLOW_ALL is passed."
      - "ToolAgent.reply and ToolAgent.stream share the same turn loop; stream mode may emit visible text incrementally once the response is no longer a tool envelope."
  - name: "speech-stack"
    owner_module: "speech inference"
    purpose: "Whisper STT and Bark TTS clients, runtime pools, streaming sessions, WAV export."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/speech"
      - "llmedge/src/main/java/io/aatricks/llmedge/speech/stt/WhisperRuntimeSupport.kt"
      - "llmedge/src/main/cpp/whisper_jni.cpp"
      - "llmedge/src/main/cpp/bark_jni.cpp"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/speech"
      - "llmedge/src/main/cpp/whisper_jni.cpp"
      - "llmedge/src/main/cpp/bark_jni.cpp"
    must_not_move_without:
      - "llmedge-whisper.cmake"
      - "llmedge-bark.cmake"
      - "NativeLibraryLoader whisper/bark candidate names"
    boundaries:
      - "SpeechRequestExecutor owns facade-level execution policy through RuntimePool; BarkTTS and Whisper stay focused on runtime wrappers."
      - "SpeechThreadingSupport is the shared thread-count policy for Bark and Whisper wrappers."
      - "SpeechClient request-object overloads are the canonical facade path (prepare/transcribe/detectLanguage/streaming/synthesize); legacy convenience overloads remain compatibility adapters and should delegate inward rather than grow new parallel wiring."
      - "WhisperRuntimeSupport plus WhisperCompanionSupport own native-load policy, load-bridge overrides, backend availability overrides, and backend fallback so Whisper stays focused on runtime behavior."
      - "WhisperCallbackSupport owns callback bridge wiring; no extra pass-through static layer remains."
      - "JNI-facing Kotlin externals must use stable exported JVM names so host/desktop native libraries do not drift from wrapper method visibility."
  - name: "image-and-video-stack"
    owner_module: "stable diffusion and wan"
    purpose: "Image generation, video generation, conditioning, metrics, backend fallback, LoRA/TAE/VAE/T5 asset resolution."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/image"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/StableDiffusionCompanionSupport.kt"
      - "llmedge/src/main/cpp/sdcpp_jni*.cpp"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/image"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion"
      - "llmedge/src/main/cpp/sdcpp_jni.cpp"
      - "llmedge/src/main/cpp/sdcpp_jni_*.cpp"
      - "llmedge/src/main/cpp/sdcpp_jni_*.h"
    must_not_move_without:
      - "llmedge-stable-diffusion.cmake"
      - "mods/ and stable-diffusion.cpp overlay assumptions"
      - "vision/ImageUtils GIF helpers used by export tests and demo"
    boundaries:
      - "ImageClient serializes image/video generation with generationMutex."
      - "ImageRuntimeRequestPlanner owns image/video runtime-spec construction and low-memory sequential-load heuristics."
      - "DiffusionRequestExecutor + RuntimePool own runtime acquire/retry/active-model plumbing; ImageGenerationExecutor owns txt2img tracing/metrics; VideoGenerationExecutor executes a planner-produced DiffusionExecutionPlan (direct or sequential)."
      - "StableDiffusionAssetRequest/StableDiffusionLoadRequest are the internal source of truth for diffusion asset/runtime/backend load plumbing; add new load flags there before threading them across helper boundaries."
      - "StableDiffusionCompanionSupport plus StableDiffusionLoader/StableDiffusionLoadSupport own diffusion dispatcher, native-load policy, direct expert-load fallback, and bridge override state so StableDiffusion stays focused on runtime behavior."
      - "StableDiffusion metadata detection should prefer GGUF/native metadata and treat filename heuristics as fallback only."
      - "Stable Diffusion prompt LoRA resolution lives in the JNI wrapper (`sdcpp_jni_shared.h` + `SdHandle.loraModelDir`); do not depend on `sd_ctx_params_t` carrying a matching upstream field."
      - "Video path has distinct direct and sequential-load flows; do not merge casually."
      - "JNI-facing Kotlin externals must keep stable JVM names; avoid coupling native symbol lookup to Kotlin internal visibility mangling."
  - name: "vision-stack"
    owner_module: "vision and OCR"
    purpose: "ML Kit OCR, projector-backed multimodal analysis, image preprocessing, temporary embedding flow."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/vision"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/ocr"
      - "llmedge/src/main/cpp/smollm_jni_embeddings.cpp"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/vision"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/ocr"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/runtime/internal/SmolLMVisionInterop.kt"
      - "llmedge/src/main/cpp/smollm_jni_embeddings.cpp"
    must_not_move_without:
      - "text-stack SmolLM native/state contracts"
      - "Projector JNI bindings"
    boundaries:
      - "OCR is independent and should keep working even when VLM/projector flow is unavailable."
      - "VisionPipeline/VisionRuntimeExecutor are the only multimodal execution path; runtime acquire/exclusive execution should stay routed through RuntimePool instead of parallel adapters."
      - "Vision request APIs accept legacy numThreads naming, but promptThreads is the preferred naming for new request shapes and prepare flows."
      - "VisionRuntimeConfig owns vision cache/thread/flash-attention/GPU defaults instead of borrowing text runtime settings."
      - "Prepared embedding .meta.json shape is native-owned; Kotlin only requires existence."
      - "GIF export internals are split across ImageGifEncoderSupport, GifEncoder, GifColorQuantizer, and GifLzwEncoder instead of one support-file monolith."
  - name: "rag-stack"
    owner_module: "retrieval augmented generation"
    purpose: "PDF reading, text splitting, sentence embeddings, vector store persistence, prompt building."
    entry_files:
      - "llmedge/src/main/java/io/aatricks/llmedge/rag"
      - "llmedge/src/main/assets/embeddings"
    allowed_edit_paths:
      - "llmedge/src/main/java/io/aatricks/llmedge/rag"
      - "llmedge/src/main/assets/embeddings"
    must_not_move_without:
      - "TextClient detached runtime loading"
      - "context.filesDir/rag_store/index.json contract"
  - name: "native-build-and-upstreams"
    owner_module: "JNI/CMake integration"
    purpose: "Compile and link four separate native engines, control overlays, expose shared-library names expected by Kotlin, and provide one parameterized Linux desktop build entrypoint."
    entry_files:
      - "llmedge/src/main/cpp/CMakeLists.txt"
      - "llmedge/src/main/cpp/cmake"
      - "scripts/build_native_linux.sh"
      - "scripts/run_native_e2e.sh"
      - "scripts/native_targets.sh"
      - "scripts/native_test_support.sh"
      - "mods"
      - "llama.cpp"
      - "stable-diffusion.cpp"
      - "whisper.cpp"
      - "bark.cpp"
    allowed_edit_paths:
      - "llmedge/src/main/cpp"
      - "llmedge/src/main/cpp/cmake"
      - "mods"
    must_not_move_without:
      - "NativeLibraryLoader candidate names"
      - "desktop build scripts under scripts/"
      - "CI native build steps"
    boundaries:
      - "Each engine keeps its own bundled ggml to avoid symbol conflicts."
      - "llmedge-targets.cmake is the native target-name and target-group source of truth; generate_native_target_names.sh emits the shell/Kotlin metadata consumed by native_targets.sh and NativeTargetNames.kt."
      - "Behavior-preserving helper splits such as llm_backend_support.cpp and whisper_jni_common.cpp are preferred over growing the primary JNI entrypoint files."
      - "scripts/run_native_e2e.sh is the primary desktop E2E entrypoint; run_text_e2e.sh, run_whisper_e2e.sh, run_linux_e2e.sh, and run_linux_e2e_sequential.sh should stay thin wrappers."
      - "Only edit upstream submodules directly when wrapper/build changes cannot solve the issue."
  - name: "gradle-and-publication"
    owner_module: "build and distribution"
    purpose: "Own Gradle module metadata, Android publication wiring, POM/signing inputs, and release-package automation."
    entry_files:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "llmedge/build.gradle.kts"
      - ".github/workflows/publish-central.yml"
      - ".github/workflows/publish-packages.yml"
      - "README.md"
    allowed_edit_paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "llmedge/build.gradle.kts"
      - ".github/workflows"
      - "README.md"
    must_not_move_without:
      - "consumer dependency snippets in llmedge-examples and README"
      - "CI workflows that build the release AAR"
    boundaries:
      - "The Android `release` variant is the source of truth for published AARs."
      - "Publication coordinates and POM metadata flow from Gradle properties so CI can override versions without editing tracked files."
      - "Maven Central publishing is routed through the Gradle Maven Publish Plugin and Central Portal token properties."
      - "GitHub Packages automation may publish online without extra repository secrets beyond the default GitHub token."
  - name: "example-app-and-smokes"
    owner_module: "consumer verification"
    purpose: "Manual demos, composite-build validation, activity-level smoke coverage."
    entry_files:
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample"
      - "llmedge-examples/app/src/main/AndroidManifest.xml"
      - "scripts/validate_examples.sh"
    allowed_edit_paths:
      - "llmedge-examples"
      - "scripts/validate_examples.sh"
    must_not_move_without:
      - "public library APIs referenced by activities"
      - "README example snippets and CI validation"
    boundaries:
      - "Activities stay thin; view binding, request parsing, file/export helpers, and controller logic belong in demo/common support files."
      - "RAG, image, video, and tools demos should keep async workflow/state orchestration in dedicated controller/support files instead of growing activities."
      - "Example-app demo flows should prefer LLMEdge facade clients plus edge.models over direct expert runtime loads or direct HuggingFaceHub calls."
