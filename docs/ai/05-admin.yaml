schema: ai-context/v1
where_to_start:
  public_api_or_consumer_breakage:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/LLMEdge.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/Deprecated.kt"
      - "llmedge-examples/settings.gradle.kts"
      - "scripts/validate_examples.sh"
    verify_with:
      - "./gradlew :llmedge:assembleRelease"
      - "bash scripts/validate_examples.sh"
  model_download_or_cache_issues:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/model/ModelRepository.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/model/ModelRegistry.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HuggingFaceHub.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HFDownloadSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HFFileSelectionSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/SystemDownload.kt"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest --tests '*HuggingFace*'"
  text_or_tool_calling_regressions:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/text"
      - "llmedge/src/main/java/io/aatricks/llmedge/tools"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest"
      - "./gradlew :llmedge:testDebugUnitTest --tests '*TextClientTest'"
      - "./gradlew :llmedge:testDebugUnitTest --tests '*ToolAgentTest'"
      - "bash scripts/run_native_e2e.sh text"
  speech_regressions:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/speech"
      - "llmedge/src/main/cpp/whisper_jni.cpp"
      - "llmedge/src/main/cpp/bark_jni.cpp"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest --tests '*WhisperTest'"
      - "./gradlew :llmedge:testDebugUnitTest --tests '*BarkTTSTest'"
      - "bash scripts/run_native_e2e.sh whisper"
  image_or_video_regressions:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/image"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion"
      - "llmedge/src/main/cpp/sdcpp_jni*.cpp"
      - "llmedge/src/main/cpp/cmake/llmedge-stable-diffusion.cmake"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest --tests '*ImageClientTest'"
      - "./gradlew :llmedge:testDebugUnitTest --tests '*VideoGenerationTest'"
      - "./gradlew :llmedge:pixel6api33DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.aatricks.llmedge.ImageGenerationTest,io.aatricks.llmedge.PerformanceOptimizationTest"
  vision_or_ocr_regressions:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/vision"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/runtime/internal/SmolLMVisionInterop.kt"
      - "llmedge/src/main/cpp/smollm_jni_embeddings.cpp"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest --tests '*Vision*Test'"
      - "./gradlew :llmedge:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.aatricks.llmedge.VisionSmokeTest"
  rag_regressions:
    inspect:
      - "llmedge/src/main/java/io/aatricks/llmedge/rag"
      - "llmedge/src/main/assets/embeddings"
    verify_with:
      - "./gradlew :llmedge:testDebugUnitTest --tests '*RAG*'"
  native_build_failures:
    inspect:
      - "llmedge/build.gradle.kts"
      - "llmedge/src/main/cpp/CMakeLists.txt"
      - "llmedge/src/main/cpp/cmake"
      - "scripts/build_native_linux.sh"
    verify_with:
      - "./gradlew :llmedge:assembleRelease -Pandroid.jniCmakeArgs='-DGGML_VULKAN=ON -DSD_VULKAN=ON'"
  publishing_or_repository_issues:
    inspect:
      - "gradle.properties"
      - "llmedge/build.gradle.kts"
      - ".github/workflows/publish-central.yml"
      - ".github/workflows/publish-packages.yml"
      - "README.md"
    verify_with:
      - "./gradlew publishToMavenLocal"
      - "./gradlew publishAndReleaseToMavenCentral -m"
      - "./gradlew publishAllPublicationsToGitHubPackagesRepository -m"
  ci_only_failures:
    inspect:
      - ".github/workflows/ci.yml"
      - ".github/workflows/android-smoke.yml"
      - ".github/workflows/publish-central.yml"
      - ".github/workflows/publish-packages.yml"
      - "gradle/llmedge-test-config.gradle"
      - "scripts/validate_examples.sh"
symptom_router:
  - symptom: "Example app stopped resolving local library APIs"
    start_here:
      - "llmedge-examples/settings.gradle.kts"
      - "scripts/validate_examples.sh"
    likely_scope:
      - "public API rename/removal in :llmedge"
      - "composite-build substitution drift"
  - symptom: "First generation works, later requests fail or leak memory"
    start_here:
      - "llmedge/src/main/java/io/aatricks/llmedge/core/LLMEdgeScope.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/ResourceScope.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime/ModelCache.kt"
    likely_scope:
      - "resource lifecycle"
      - "runtime cache eviction"
      - "active model cancellation"
  - symptom: "GPU request falls back unexpectedly"
    start_here:
      - "llmedge/src/main/java/io/aatricks/llmedge/runtime/ComputeBackend.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime/BackendCandidateResolver.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime/BackendFailureClassifier.kt"
    likely_scope:
      - "process-wide backend blacklist"
      - "OpenCL/Vulkan availability"
      - "native binding verification"
  - symptom: "Vision OCR works but VLM analyze fails"
    start_here:
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/VisionClient.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/VisionPromptSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/Projector.kt"
    likely_scope:
      - "missing or mismatched mmproj"
      - "missing explicit vision/projector hints or filename fallback mismatch"
      - "prepared-embedding fallback path"
  - symptom: "HF download finishes but file is unusable"
    start_here:
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HuggingFaceHub.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HFDownloadSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HFFileSelectionSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/HFModelDownload.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/model/ModelFileValidator.kt"
    likely_scope:
      - "repo-file vs GGUF selection and ModelSpec.hints"
      - "size or sha validation"
      - "partial .part or system-download temp handling"
doc_navigation:
  repo_rehydration: "docs/ai/00-index.yaml"
  maintenance_routing: "docs/ai/05-admin.yaml"
  runtime_and_storage_map: "docs/ai/10-system-map.yaml"
  edit_boundaries: "docs/ai/20-modules.yaml"
  payload_and_file_contracts: "docs/ai/30-contracts.yaml"
  end_to_end_behavior: "docs/ai/40-flows.yaml"
  retest_rules: "docs/ai/50-guardrails.yaml"
  deferred_cleanup: "docs/ai/60-debt.yaml"
operating_notes:
  defaults:
    - "Start in :llmedge Kotlin/C++ wrappers before editing upstream submodules."
    - "Treat llmedge-examples as the primary human smoke harness, not the source of truth for library behavior."
    - "The root Gradle build contains only :llmedge; llmedge-examples is a separate composite build that substitutes io.aatricks:llmedge with ../:llmedge."
    - "Release publication metadata and repository wiring live in gradle.properties, llmedge/build.gradle.kts, .github/workflows/publish-central.yml, and .github/workflows/publish-packages.yml."
  avoid:
    - "Do not start diagnosis in llmedge/build, .cxx, or generated site artifacts."
    - "Do not change native library names in CMake without updating NativeLibraryLoader candidate lists and desktop runner/build verification."
