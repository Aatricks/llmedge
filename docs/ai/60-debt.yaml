schema: ai-context/v1
deferred_cleanup:
  - id: "diffusion-load-parameter-plumbing"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/StableDiffusion.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/StableDiffusionLoadRequest.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/StableDiffusionLoadSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/internal/StableDiffusionLoader.kt"
    issue: "Diffusion asset/runtime/backend load flags were threaded through repeated long positional parameter lists across the public wrapper, loader, and load-support helpers."
    consequence: "Resolved: StableDiffusionAssetRequest, StableDiffusionLoadRequest, and StableDiffusionNativeLoadRequest now centralize the internal load contract so new flags are added in one place and convenience overloads only build request objects."
    recommended_cut: "Keep future diffusion load changes request-first; avoid adding new multi-layer positional plumbing unless it terminates directly at the JNI boundary."
  - id: "feature-client-wiring-duplication"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/core/FeatureClientSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/LLMEdge.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/TextClient.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/speech/SpeechClient.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/ImageClient.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/rag/RAGClient.kt"
    issue: "Feature clients previously repeated the same appContext/edgeScope/config/modelRepository wiring pattern in both direct construction and owned factory paths."
    consequence: "Resolved: shared FeatureContext/createOwnedFeature/OwnedFeatureClient now define the primary internal wiring path, and createOwnedFeatureClient/createFeatureClientForTesting standardize companion construction."
    recommended_cut: "If more features are added, route them through FeatureContext first and use the feature-client factory helpers rather than secondary constructors."
  - id: "runtime-executor-plumbing-duplication"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime/RuntimePool.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/TextRequestExecutor.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/speech/SpeechRequestExecutor.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/DiffusionRequestExecutor.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/VisionPipeline.kt"
    issue: "Feature stacks were each hand-rolling variants of runtime acquisition, retry, and exclusive execution on top of RuntimePool."
    consequence: "Resolved: RuntimePool plus RuntimeCoordinator now centralize shared execution policy; the extra executor wrapper was removed."
    recommended_cut: "Keep feature-level executors focused on behavior and diagnostics; if a new executor starts touching coordinator policy loops directly, treat that as a design smell."
  - id: "runtime-pool-configuration-duplication"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/core/runtime/RuntimePool.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/text/TextRuntimeSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/speech/SpeechRuntimeSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/ImageRuntimeSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/VisionRuntimeSupport.kt"
    issue: "Feature runtime support files repeated identical createCachedRuntimePool wiring shape (cache config, key prefix, loader, active backend, candidate request)."
    consequence: "Resolved: RuntimePoolProfile/runtimePoolProfile now define a shared runtime-pool profile contract reused across text/speech/image/vision."
    recommended_cut: "When adding new runtime-backed features, start with runtimePoolProfile and keep pool profiles declarative."
  - id: "desktop-e2e-script-duplication"
    status: "resolved"
    files:
      - "scripts/run_native_e2e.sh"
      - "scripts/run_text_e2e.sh"
      - "scripts/run_whisper_e2e.sh"
      - "scripts/run_linux_e2e.sh"
      - "scripts/run_linux_e2e_sequential.sh"
    issue: "Desktop E2E shell scripts duplicated setup logic for native artifact discovery, model defaults, and Gradle invocation."
    consequence: "Resolved: scripts/run_native_e2e.sh is now the canonical host runner and per-suite scripts delegate to it."
    recommended_cut: "Keep suite-specific wrappers as thin delegates; add new suites in run_native_e2e.sh first."
  - id: "video-plan-branching-duplication"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/image/ImageRuntimeRequestPlanner.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/VideoGenerationExecutor.kt"
    issue: "Video direct vs sequential execution previously branched independently in executor flow and request planning."
    consequence: "Resolved: planner now emits a sealed DiffusionExecutionPlan consumed by VideoGenerationExecutor, keeping branch policy in one place."
    recommended_cut: "Add new video execution modes by extending DiffusionExecutionPlan first, then executor handling."
  - id: "wan-registry-shape-loss"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/huggingface/WanModelRegistry.kt"
      - "llmedge/src/main/assets/wan-models/model-registry.json"
    issue: "Wan registry metadata previously dropped runtime-relevant fields from the asset JSON."
    consequence: "Resolved: Kotlin now preserves architecture/modelType/mobileSupported/recommendedMinRAM/description and caches per asset manager."
    recommended_cut: "Keep registry parsing aligned with asset shape when new metadata fields are introduced."
  - id: "tool-streaming-not-token-live"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/tools/ToolAgent.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/tools/ToolAgentTurnLoop.kt"
    issue: "ToolAgent.stream previously buffered a full model step before forwarding final text."
    consequence: "Resolved: stream mode now emits user-visible text incrementally once the response is no longer a JSON-only tool envelope."
    recommended_cut: "Preserve the JSON-only tool-call contract if streaming heuristics are changed again."
  - id: "filename-heuristic-capability-detection"
    status: "resolved"
    files:
      - "llmedge/src/main/java/io/aatricks/llmedge/vision/VisionPromptSupport.kt"
      - "llmedge/src/main/java/io/aatricks/llmedge/image/diffusion/StableDiffusionMetadataSupport.kt"
    issue: "Vision and video capability detection previously leaned on filename/model-id heuristics."
    consequence: "Resolved: GGUF/native metadata is now consulted first, with naming heuristics left as compatibility fallback only."
    recommended_cut: "Keep metadata-first detection in place when adding new model families or sidecar metadata."
refactor_targets:
  - name: "native-build-boundaries"
    files:
      - "llmedge/src/main/cpp/cmake"
      - "scripts/build_native_linux.sh"
      - "scripts/native_targets.sh"
      - "scripts/native_test_support.sh"
      - ".github/workflows/ci.yml"
    goal: "Keep Android CMake, the parameterized Linux build entrypoint, CI prerequisites, and host E2E helpers aligned through shared target metadata."
  - name: "example-app-controllers"
    files:
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/image"
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/video"
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/rag"
      - "llmedge-examples/app/src/main/java/com/example/llmedgeexample/demo/tools"
    goal: "Keep demo activities thin and push reusable smoke/demo logic into controllers/support classes; image/video view binding, RAG async workflow logic, form parsing, and media/export helpers are extracted, but more UI-state orchestration can still move out of activities."
recommended_next_cuts:
  - "Continue moving wrapper-companion/native-load state out of remaining runtime facades when new engines are added so the public wrappers stay thin."
  - "Expose backend details consistently across all runtime traces and user-facing diagnostics for easier fallback debugging."
  - "Keep the shell, generated Kotlin constants, and CMake native target metadata aligned through llmedge-targets.cmake if new engines, aliases, host outputs, or logical target groups are introduced."
  - "Continue trimming example-app activity orchestration, especially tool and video demos, by moving workflow code into controllers/support files instead of growing activity classes."
