schema: ai-context/v1
startup_sequences:
  facade_boot:
    trigger: "app or test calls LLMEdge.create(context, scope, config, resolver)"
    ordered_steps:
      - "ClientBootstrap.createOwned captures applicationContext and creates LLMEdgeScope sized from config.execution.inferenceThreads"
      - "construct ModelManager and feature clients"
      - "optional lifecycle bind via LLMEdgeLifecycle.bind(owner, edge)"
  model_download_and_cache:
    trigger: "ModelManager.resolve/prefetch or any runtime loader resolving a ModelSpec.HuggingFace"
    ordered_steps:
      - "query Hugging Face siblings list via HFModelTree"
      - "select filename or quantized GGUF via HFFileSelectionSupport"
      - "build destination under filesDir/hf-models/<repo>/<revision>"
      - "reuse cached file if HFDownloadSupport validation succeeds and forceDownload=false"
      - "optionally download via DownloadManager temp file, else stream via OkHttp into .part"
      - "verify size and optional sha256, then expose final file"
  text_generation:
    trigger: "TextClient.generate/stream"
    ordered_steps:
      - "build runtime cache key from ModelSpec + text options"
      - "acquire cached runtime or load SmolLM through RuntimePool"
      - "prepare model by clearing messages/KV cache and injecting optional system prompt"
      - "run blocking generation or batch streaming"
      - "store GenerationMetrics"
      - "clear KV cache after request"
      - "generate path uses RuntimeExecution for backend-specific failure retry"
      - "on decode failure, retry once with CPU-safe settings (useVulkan=false, flash=false, batchSize=1)"
  chat_session:
    trigger: "ChatSession.reply/stream"
    ordered_steps:
      - "preview transcript with new user message"
      - "if lastStateSnapshot exists and window grew by exactly one message, restore native state"
      - "else render full replay prompt with PromptRenderer"
      - "generate assistant reply"
      - "commit transcript"
      - "store snapshot for reply path only; streaming path invalidates snapshot"
  tool_agent:
    trigger: "ToolAgent.reply/stream"
    ordered_steps:
      - "seed transcript and prepend tool system prompt"
      - "run the shared ToolAgentTurnLoop for either blocking reply or streamed response collection"
      - "ask text model for next turn"
      - "ToolCallParser classifies output as final text, invalid invocation, or tool invocation"
      - "stream mode emits visible text incrementally once the response is no longer a JSON-only tool envelope"
      - "validate schema, enforce policy for action tools, execute tool handler"
      - "append TOOL role result message to working prompt"
      - "repeat until final text or maxSteps"
  speech_to_text:
    trigger: "SpeechClient.transcribe / createStreamingSession"
    ordered_steps:
      - "acquire Whisper runtime"
      - "run transcribe/detectLanguage/createStreamingTranscriber under runtime mutex"
      - "execute through RuntimeExecution so backend-specific failures retry via RuntimePool policy"
  text_to_speech:
    trigger: "SpeechClient.synthesize / synthesizeStream"
    ordered_steps:
      - "acquire Bark runtime"
      - "run Bark generation under runtime mutex with shared runtime retry/exclusive execution policy"
      - "for stream path, emit Started -> Progress -> Result -> Completed"
      - "optional caller-side WAV export via BarkTTS.saveAsWav()"
  image_generation:
    trigger: "ImageClient.generate"
    ordered_steps:
      - "serialize request through generationMutex"
      - "ImageRuntimeRequestPlanner builds IMAGE runtime spec/options"
      - "ImageGenerationExecutor handles runtime acquisition, tracing, metrics, and cancellation state"
      - "acquire runtime with backend fallback"
      - "open StableDiffusion model as activeModel for cancellation"
      - "resolve EasyCache support and run txt2img"
      - "capture request trace and metrics"
      - "for image loads only, retry once without flash attention when initial load fails and sequential load was not forced"
  video_generation:
    trigger: "ImageClient.generateVideo"
    modes:
      direct:
        ordered_steps:
          - "ImageRuntimeRequestPlanner builds VIDEO runtime with diffusion + optional VAE/T5/TAE"
          - "VideoGenerationExecutor direct path acquires one warmed runtime"
          - "run txt2vid in one warmed runtime"
      sequential:
        ordered_steps:
          - "ImageRuntimeRequestPlanner builds VIDEO_TEXT_ENCODER runtime"
          - "load VIDEO_TEXT_ENCODER runtime"
          - "precompute cond/uncond text conditioning"
          - "ImageRuntimeRequestPlanner builds the sequential VIDEO diffusion runtime"
          - "VideoGenerationExecutor sequential path reacquires the diffusion runtime after conditioning"
          - "load VIDEO diffusion runtime"
          - "run txt2VidWithPrecomputedCondition"
    shared_steps:
      - "emit GenerationStreamEvent.Progress messages"
      - "cancelGeneration() delegates to current active StableDiffusion runtime"
  vision_analysis:
    trigger: "VisionClient.analyze"
    ordered_steps:
      - "acquire vision runtime for model + projector"
      - "preprocess bitmap to <=672 max dimension"
      - "try primeImageBuffer on SmolLM"
      - "if unavailable, try encodeImageBuffer + decodeEmbeddingsBuffer"
      - "if still unavailable, create temp jpg/bin/.meta.json files and run file-based path directly in VisionRuntimeExecutor"
      - "collect runtime memory estimate and delete temp files"
    parallel_flow:
      ocr_only:
        ordered_steps:
          - "VisionClient.extractText creates MlKitOcrEngine"
          - "runs OCR without loading vision-language model"
  artifact_publication:
    trigger: "maintainer runs a publish Gradle task or GitHub Actions publish-packages workflow"
    ordered_steps:
      - "resolve GROUP, VERSION_NAME, and POM_* metadata from gradle.properties or CI overrides"
      - "if triggered from a Git tag, strip a leading `V` or `v` before setting VERSION_NAME"
      - "for Maven Central, normalize either MAVEN_SIGNING_KEY_B64 or MAVEN_SIGNING_KEY into ORG_GRADLE_PROJECT_signingInMemoryKey"
      - "assemble the Android `release` component with native libraries"
      - "package the AAR plus sources/javadocs into the Maven publication"
      - "publish to Maven Local, Maven Central, ConfiguredRemote, or GitHub Packages"
      - "sign the publication only when signAllPublications and in-memory signing credentials are present"
  rag_flow:
    trigger: "RAGClient.createSession / RAGEngine.indexPdf / ask"
    ordered_steps:
      - "load detached text runtime"
      - "init vector store from filesDir/rag_store/index.json"
      - "copy embedding assets to filesDir/embedding_models and initialize SentenceEmbedding"
      - "read PDF text, split, embed, and persist vector entries"
      - "retrieve topK by cosine similarity"
      - "inject fixed system prompt once and ask SmolLM with context-only prompt"
sync_behavior:
  statement: "No cross-device or server-side sync exists; all durable state is app-private file storage."
  process_level_effects:
    - "Backend blacklist is process-wide and affects later runtime acquisitions."
    - "Model caches are per-LLMEdge/client instance but share the same file-backed model downloads."
save_export_behavior:
  image_and_video:
    - "ImageClient returns Bitmap or List<Bitmap>; caller/export helpers own persistence."
    - "ImageUtils.createAnimatedGif(frames, delayMs, output, loop, quality) writes GIF bytes to caller-supplied OutputStream."
  speech:
    - "BarkTTS.saveAsWav(audio, filePath) writes a RIFF/WAV file directly to caller-supplied path."
  rag:
    - "indexPdf persists vector entries to context.filesDir/rag_store/index.json."
selection_flows:
  model_selection:
    - "Text/speech/image default ModelSpec values come from ModelRegistry."
    - "ModelRepository prefers explicit ModelSpec.hints.artifactKind/capabilities before filename-extension heuristics."
    - "GGUF capability detection for vision/video now consults GGUF metadata first and falls back to filename/model-id heuristics only when metadata is unavailable."
    - "Hugging Face GGUF auto-selection prefers DEFAULT_QUANTIZATION_PRIORITIES unless explicit filename is provided."
    - "Non-.gguf explicit filenames route through generic repo-file resolution."
  backend_selection:
    - "When GPU is allowed, candidate order is OPENCL then VULKAN then CPU."
    - "RuntimeCoordinator owns pooled-runtime backend candidate loading and blacklists failed GPU backends for the subsystem."
    - "RuntimeExecution removes the failed cached runtime and retries the next backend candidate for text, image/video, and whisper requests."
  native_library_selection:
    - "SmolLM shared library name depends on CPU features; generic smollm is the final fallback."
    - "Whisper chooses whisper_jni on desktop Linux and prefers whisper_jni on Android before trying legacy whisper_arm64/whisper fallbacks."
manual_smoke_checks:
  - name: "examples-build"
    trigger_for:
      - "public API changes"
      - "consumer-facing config/default changes"
    command: "bash scripts/validate_examples.sh"
  - name: "text-demo"
    trigger_for:
      - "TextClient, ChatSession, ToolAgent, ModelRepository, RuntimeExecution changes"
    path: "llmedge-examples -> MainActivity -> Hugging Face Demo"
    expect:
      - "model downloads to hf-models"
      - "response text renders"
      - "metrics appear after generation"
  - name: "tool-demo"
    trigger_for:
      - "tools package changes"
    path: "llmedge-examples -> MainActivity -> Tool Calling Demo"
    expect:
      - "time/battery tools execute"
      - "action policy gating still works when open_browser is requested"
  - name: "vision-smoke"
    trigger_for:
      - "vision or projector changes"
    command: "./gradlew :llmedge:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.aatricks.llmedge.VisionSmokeTest"
  - name: "android-image-smoke"
    trigger_for:
      - "image/video backend or memory-heuristic changes"
    command: "./gradlew :llmedge:pixel6api33DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.aatricks.llmedge.ImageGenerationTest,io.aatricks.llmedge.PerformanceOptimizationTest"
  - name: "desktop-text-e2e"
    trigger_for:
      - "SmolLM JNI, text runtime, desktop native-load changes"
    command: "bash scripts/run_native_e2e.sh text"
  - name: "desktop-whisper-e2e"
    trigger_for:
      - "Whisper JNI, speech runtime, desktop native-load changes"
    command: "bash scripts/run_native_e2e.sh whisper"
  - name: "desktop-video-e2e"
    trigger_for:
      - "Stable Diffusion JNI, image/video runtime, desktop native-load changes"
    command: "bash scripts/run_native_e2e.sh video"
  - name: "publish-local-smoke"
    trigger_for:
      - "Gradle publication metadata or publish workflow changes"
    command: "./gradlew publishToMavenLocal"
  - name: "rag-demo"
    trigger_for:
      - "RAG or embedding changes"
    path: "llmedge-examples -> MainActivity -> RAG Demo"
    expect:
      - "PDF indexes"
      - "retrieval-backed answer returns"
